name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-tests.sh compares with the previous push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx eslint .
      - name: Roadmap format
        run: node scripts/polish/roadmap-lint.mjs
      - name: Test integrity (since the previous push)
        env:
          POLISH_BASE: ${{ github.event.before }}
        run: scripts/polish/check-tests.sh
      - name: Build web
        # Also copies index.html to 404.html (deep links on GitHub Pages) and adds .nojekyll (keeps _expo/).
        run: npm run build:web
      - name: End-to-end tests
        env:
          E2E_PREBUILT: '1'
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
