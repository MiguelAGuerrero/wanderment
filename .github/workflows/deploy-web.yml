name: Deploy web

# Every push to main is checked, built, end-to-end tested and only then deployed to GitHub Pages
# (Settings → Pages → Source: "GitHub Actions"). The pushed tree already passed
# scripts/polish/verify.sh locally (the push guard enforces it, including a CI-speed pass of the changed
# specs); here the whole e2e suite must pass — a failure or a flaky test (failOnFlakyTests) holds the
# deploy back, so the live site always matches a fully green run. Fix forward.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # deploy to Pages
  id-token: write # verify the deployment came from this workflow

# One deployment at a time; a newer push waits rather than cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx eslint .
      - name: Build web
        # Also copies index.html to 404.html (deep links on GitHub Pages).
        run: npm run build:web
      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    # Gates the deploy (below): nothing is published until the whole suite is green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: End-to-end tests
        env:
          E2E_PREBUILT: '1'
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
